name: Load Testing (Artillery)

on:
  pull_request:
    branches: [main]
    paths:
      - 'load-test/**'
  push:
    branches: [main]
    paths:
      - 'load-test/**'
  # Allow manual trigger to run heavier suites against a deployed environment.
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run (smoke | orders | websocket | full)'
        required: true
        default: 'smoke'
      api_base_url:
        description: 'Target backend base URL'
        required: false
        default: 'http://localhost:3001'

jobs:
  load-test-smoke:
    name: Artillery Load Test (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: load-test/package-lock.json

      - name: Install load-test dependencies
        run: npm ci
        working-directory: load-test

      - name: Start backend
        run: |
          npm --prefix backend install
          (npm --prefix backend run start > /tmp/backend.log 2>&1 &)
          sleep 15
          curl --retry 20 --retry-delay 2 --retry-connrefused \
            http://localhost:3001/health || (echo "Backend failed to start"; cat /tmp/backend.log; exit 1)

      - name: Run load-test smoke scenario
        run: npm run loadtest:smoke
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://localhost:3001' }}
          WS_BASE_URL: ws://localhost:3001/ws

      - name: Upload load-test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-smoke-report
          path: load-test/reports/

  load-test-heavy:
    name: Artillery Load Test (heavy, manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: load-test/package-lock.json

      - name: Install load-test dependencies
        run: npm ci
        working-directory: load-test

      - name: Run selected scenario
        run: npm run loadtest:${{ github.event.inputs.scenario }}
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://localhost:3001' }}
          WS_BASE_URL: ws://localhost:3001/ws

      - name: Upload load-test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: load-test/reports/
