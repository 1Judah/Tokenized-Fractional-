events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # API requests: 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # DDoS protection: max 50 simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # ── Global security headers ───────────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header X-XSS-Protection         "1; mode=block"  always;
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── TLS session caching (shared across workers) ───────────────────────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Diffie-Hellman parameters ─────────────────────────────────────────────
    # Generate once with:  openssl dhparam -out /etc/ssl/rwa/dhparam.pem 2048
    # Uncomment after generation:
    # ssl_dhparam /etc/ssl/rwa/dhparam.pem;

    # ── Permitted TLS versions and cipher suites ──────────────────────────────
    # TLS 1.2 and 1.3 only; TLS 1.0 and 1.1 are disabled.
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Prefer server ciphers for TLS 1.2; TLS 1.3 uses its own negotiation.
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

    # ── OCSP stapling ─────────────────────────────────────────────────────────
    # Reduces TLS handshake latency; requires a publicly trusted CA.
    # Uncomment when using Let's Encrypt or another public CA.
    # ssl_stapling        on;
    # ssl_stapling_verify on;
    # resolver            8.8.8.8 8.8.4.4 valid=300s;
    # resolver_timeout    5s;

    # ─────────────────────────────────────────────────────────────────────────
    # HTTP → HTTPS redirect (port 80)
    # All plain-HTTP traffic is permanently redirected to HTTPS.
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge pass-through for Let's Encrypt / certbot renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # HTTPS server (port 443) — TLS termination
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name localhost;

        # ── Certificate paths ─────────────────────────────────────────────────
        # Replace with real certificate paths in production.
        # For local dev, generate with:  bash scripts/generate-certs.sh
        ssl_certificate     /etc/ssl/rwa/nginx.crt;
        ssl_certificate_key /etc/ssl/rwa/nginx.key;

        # ── HTTP Strict Transport Security (HSTS) ─────────────────────────────
        # Tells browsers to always use HTTPS for this host.
        # Start with a short max-age in staging; increase to 31536000 (1 year)
        # once confident, then consider adding to HSTS preload lists.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # DDoS protection
        limit_conn addr_limit 50;

        # ── Basic WAF rules ───────────────────────────────────────────────────
        if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|zmap)) {
            return 403;
        }
        if ($query_string ~* "union.*select.*\(") {
            return 403;
        }
        if ($query_string ~* "concat.*\(") {
            return 403;
        }

        # ── /api/* → Express backend ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;

            # Forward client IP for accurate rate limiting and audit logs
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── /* → Vite / React frontend ─────────────────────────────────────────
        location / {
            proxy_pass         http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
